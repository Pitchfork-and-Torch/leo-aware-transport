[project]
name = "leo-aware-transport"
version = "0.3.22"
description = "LEO-aware congestion control research prototype (Starlink-class dynamics)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pandas>=2.0",
  # leo_cc.ascent_d imports reedsolo unconditionally; leo_cc.sim imports it
  # transitively, so the leo-run entry point needs it even for endpoint-only runs.
  "reedsolo>=1.7",
]

[project.scripts]
leo-run = "experiments.run_suite:main"

[tool.setuptools.packages.find]
include = ["leo_cc*", "experiments*"]
